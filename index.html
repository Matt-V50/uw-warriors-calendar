<!DOCTYPE html>
<html>
<head>
    <title>UW Warriors Calendar</title>
    <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --warriors-black: #000000;
            --warriors-gold: #FFD100;
            --warriors-dark-gold: #E6BC00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            font-family: system-ui, -apple-system, sans-serif;
            background: #f8fafc;
        }

        header {
            background: var(--warriors-black);
            color: white;
            padding: 1rem;
            text-align: center;
            border-bottom: 4px solid var(--warriors-gold);
        }

        header h1 {
            color: var(--warriors-gold);
            font-weight: bold;
            text-transform: uppercase;
        }

        main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .calendar-container {
            background: white;
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 2px solid var(--warriors-black);
        }

        .calendar-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-self: start;
        }

        .sport-actions {
            display: flex;
            gap: 0.5rem;
        }

        .sport-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            padding: 1rem 1.5rem;
            background: var(--warriors-black);
            color: var(--warriors-gold);
            border: 2px solid var(--warriors-gold);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            font-weight: bold;
            text-align: left;
        }

        .sport-btn:hover,
        .sport-btn.active {
            background: var(--warriors-gold);
            color: var(--warriors-black);
        }

        .sport-btn:hover {
            transform: translateY(-2px);
        }

        .sport-btn i {
            font-size: 1.5rem;
        }

        .copy-btn {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--warriors-black);
            color: var(--warriors-gold);
            border: 2px solid var(--warriors-gold);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .copy-btn:hover {
            background: var(--warriors-gold);
            color: var(--warriors-black);
            transform: translateY(-2px);
        }

        .copy-btn i {
            font-size: 1.5rem;
        }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--warriors-gold);
            color: var(--warriors-black);
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            font-weight: bold;
            border: 2px solid var(--warriors-black);
        }

        .toast.show {
            opacity: 1;
        }

        footer {
            background: var(--warriors-black);
            color: white;
            padding: 1rem;
            text-align: center;
            border-top: 4px solid var(--warriors-gold);
        }

        footer a {
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        footer a:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
                padding: 1rem;
            }

            .calendar-iframe {
                height: 400px;
            }

            .sport-btn {
                padding: 0.75rem 1rem;
            }

            .copy-btn {
                padding: 0.75rem;
            }

            .buttons-container {
                align-self: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>UW Warriors Calendar</h1>
    </header>

    <main>
        <div class="calendar-container">
            <iframe 
                src="https://calendar.google.com/calendar/embed?height=600&wkst=2&ctz=America%2FToronto&showPrint=0&mode=WEEK&showCalendars=0&src=NDI2ODljYmIyZDEwZTY4N2RjNTA1NmM2NTFlMzk3ZWI0YTdiYWNiYzBkMGNiOWRhNmY4ZmY1ZWJiYTZjOWY1Y0Bncm91cC5jYWxlbmRhci5nb29nbGUuY29t&color=%238E24AA"
                class="calendar-iframe"
                id="calendar-frame"
                scrolling="no">
            </iframe>
        </div>

        <div class="buttons-container" id="buttons">
        </div>
    </main>

    <div id="toast" class="toast">Copied!</div>

    <footer>
        <a href="https://github.com/Matt-V50/uw-warriors-calendar">
            <img src="https://img.shields.io/badge/github-%23FFCF00.svg?style=for-the-badge&logo=github&logoColor=black&style=flat" alt="GitHub">
        </a>
    </footer>
    <script>
        const links = [{"sport": "tennis-ball", "text": "pickleball", "url": "/pickleball"}, {"sport": "badminton-shuttle", "text": "badminton", "url": "/badminton"}];
        const calendarIds = {"badminton": "NDI2ODljYmIyZDEwZTY4N2RjNTA1NmM2NTFlMzk3ZWI0YTdiYWNiYzBkMGNiOWRhNmY4ZmY1ZWJiYTZjOWY1Y0Bncm91cC5jYWxlbmRhci5nb29nbGUuY29t", "pickleball": "MjU3MzczNjVmYjdmYjM3ZDgyZDgwYzBiYmE2OGM0ZDk5YmJhZDVlNWU3NDdlMTVlOTg2M2ZiNmU3OTc4NDk5MEBncm91cC5jYWxlbmRhci5nb29nbGUuY29t"};

        const toast = document.getElementById('toast');
        const container = document.getElementById('buttons');
        const calendarFrame = document.getElementById('calendar-frame');
        const embedUrl = 'https://calendar.google.com/calendar/embed?height=600&wkst=2&ctz=America%2FToronto&showPrint=0&mode=WEEK&showCalendars=0&src=';

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        links.forEach(({text, url, sport}) => {
            const actions = document.createElement('div');
            actions.className = 'sport-actions';

            const selectButton = document.createElement('button');
            selectButton.className = 'sport-btn';
            selectButton.type = 'button';
            selectButton.setAttribute('aria-pressed', 'false');
            selectButton.innerHTML = `
                <i class="hgi-stroke hgi-${sport}"></i>
                ${text}
            `;
            selectButton.onclick = () => {
                const calendarId = calendarIds[text.toLowerCase()];
                if (!calendarId) {
                    return;
                }

                calendarFrame.src = `${embedUrl}${encodeURIComponent(calendarId)}&color=%238E24AA`;
                container.querySelectorAll('.sport-btn').forEach(button => {
                    const selected = button === selectButton;
                    button.classList.toggle('active', selected);
                    button.setAttribute('aria-pressed', String(selected));
                });
            };

            const copyButton = document.createElement('button');
            copyButton.className = 'copy-btn';
            copyButton.type = 'button';
            copyButton.setAttribute('aria-label', `Copy ${text} calendar link`);
            copyButton.innerHTML = '<i class="hgi-stroke hgi-copy"></i>';
            copyButton.onclick = async () => {
                const calendarUrl = new URL(`.${url}`, window.location.href);
                try {
                    await navigator.clipboard.writeText(calendarUrl.href);
                    showToast('Copied!');
                } catch (error) {
                    showToast('Could not copy link');
                }
            };

            actions.append(selectButton, copyButton);
            container.appendChild(actions);
        });

        const initialButton = [...container.querySelectorAll('.sport-btn')]
            .find(button => button.textContent.trim().toLowerCase() === 'badminton');
        if (initialButton) {
            initialButton.classList.add('active');
            initialButton.setAttribute('aria-pressed', 'true');
        }
    </script>
</body>
</html>
